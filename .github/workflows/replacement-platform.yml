name: Replacement Platform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://postgres:lobbystack@127.0.0.1:5432/lobbystack
      REDIS_URL: redis://127.0.0.1:6379
      LOBBYSTACK_APP_DATABASE_URL: postgres://lobbystack_app:app@127.0.0.1:5432/lobbystack
      LOBBYSTACK_AUTH_DATABASE_URL: postgres://lobbystack_auth:auth@127.0.0.1:5432/lobbystack
      LOBBYSTACK_WORKER_DATABASE_URL: postgres://lobbystack_worker:worker@127.0.0.1:5432/lobbystack
      LOBBYSTACK_DISPATCHER_DATABASE_URL: postgres://lobbystack_dispatcher:dispatcher@127.0.0.1:5432/lobbystack
      VERIFY_RLS_BEHAVIOR: "true"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: lobbystack
          POSTGRES_DB: lobbystack
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lobbystack"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Initialize replacement runtime roles
        run: PGPASSWORD=lobbystack PGHOST=127.0.0.1 PGPORT=5432 POSTGRES_USER=postgres POSTGRES_DB=lobbystack bash docker/postgres/init/roles.sh
      - run: pnpm db:migrate
      - name: Verify migration rerun safety
        run: pnpm db:migrate
      - run: pnpm db:check
      - run: VERIFY_RLS_BEHAVIOR=true pnpm db:verify-rls
      - run: pnpm db:seed
      - run: pnpm replacement:inventory
      - run: pnpm replacement:parity
      - run: pnpm replacement:admin-ui-parity
      - run: pnpm replacement:drift
      - run: pnpm replacement:security
      - run: pnpm replacement:recovery
      - run: pnpm replacement:notifications
      - run: pnpm replacement:billing
      - run: pnpm replacement:auth
      - run: pnpm replacement:email-send
      - run: pnpm replacement:sms-consent
      - run: pnpm replacement:feedback
      - run: pnpm replacement:appointment-audits
      - run: pnpm replacement:unit-economics
      - run: pnpm replacement:import-check
      - run: pnpm replacement:reconciliation
      - run: pnpm replacement:phone-onboarding
      - run: pnpm replacement:call-detail
      - run: pnpm replacement:roles
      - run: pnpm replacement:locale
      - name: Run deterministic release baseline
        run: pnpm exec tsx --tsconfig scripts/tsconfig.json scripts/release-readiness.ts --evidence certification-results/deterministic-baseline.json
      - name: Retain deterministic release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replacement-deterministic-baseline-${{ github.sha }}
          path: certification-results/deterministic-baseline.json
          retention-days: 90
      - run: pnpm --filter @lobbystack/admin exec playwright install --with-deps chromium
      - run: pnpm --filter @lobbystack/admin e2e
      - name: Build replacement runtime images
        run: |
          docker build --build-arg SERVICE_VERSION="$GITHUB_SHA" --file Dockerfile.admin --tag lobbystack/admin:ci .
          docker build --build-arg SERVICE_VERSION="$GITHUB_SHA" --file Dockerfile.migrator --tag lobbystack/migrator:ci .
          docker build --build-arg SERVICE_VERSION="$GITHUB_SHA" --file Dockerfile.worker --tag lobbystack/worker:ci .
          docker build --build-arg SERVICE_VERSION="$GITHUB_SHA" --file Dockerfile.voice-gateway --tag lobbystack/voice-gateway:ci .
      - run: pnpm replacement:telemetry
      - name: Scan repository for vulnerabilities, misconfigurations, and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan admin image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lobbystack/admin:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Scan migrator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lobbystack/migrator:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lobbystack/worker:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Scan voice gateway image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lobbystack/voice-gateway:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

  staging-provider-certification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: replacement-staging
    env:
      ADMIN_BASE_URL: ${{ secrets.REPLACEMENT_ADMIN_BASE_URL }}
      WORKER_BASE_URL: ${{ secrets.REPLACEMENT_WORKER_BASE_URL }}
      VOICE_BASE_URL: ${{ secrets.REPLACEMENT_VOICE_BASE_URL }}
      DATABASE_URL: ${{ secrets.REPLACEMENT_DATABASE_URL }}
      REPLACEMENT_MIGRATOR_DATABASE_URL: ${{ secrets.REPLACEMENT_MIGRATOR_DATABASE_URL }}
      REPLACEMENT_APP_DATABASE_URL: ${{ secrets.REPLACEMENT_APP_DATABASE_URL }}
      REPLACEMENT_WORKER_DATABASE_URL: ${{ secrets.REPLACEMENT_WORKER_DATABASE_URL }}
      RELEASE_CERTIFICATION_TARGET: isolated-staging
      REDIS_URL: ${{ secrets.REPLACEMENT_REDIS_URL }}
      REPLACEMENT_REDIS_HOST: ${{ secrets.REPLACEMENT_REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REPLACEMENT_REDIS_PORT }}
      REPLACEMENT_S3_ENDPOINT: ${{ secrets.REPLACEMENT_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.REPLACEMENT_S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.REPLACEMENT_S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.REPLACEMENT_S3_SECRET_ACCESS_KEY }}
      POLAR_WEBHOOK_SECRET: ${{ secrets.REPLACEMENT_POLAR_WEBHOOK_SECRET }}
      TWILIO_AUTH_TOKEN: ${{ secrets.REPLACEMENT_TWILIO_AUTH_TOKEN }}
      INTERNAL_SERVICE_SECRET: ${{ secrets.REPLACEMENT_INTERNAL_SERVICE_SECRET }}
      REPLACEMENT_TEST_BUSINESS_SLUG: ${{ secrets.REPLACEMENT_TEST_BUSINESS_SLUG }}
      RESEND_WEBHOOKS_ENABLED: ${{ vars.REPLACEMENT_RESEND_WEBHOOKS_ENABLED }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.REPLACEMENT_RESEND_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run explicit staging certification gates
        run: pnpm exec tsx --tsconfig scripts/tsconfig.json scripts/release-readiness.ts --staging --evidence certification-results/staging-gates.json
      - name: Retain certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replacement-staging-certification-${{ github.sha }}
          path: certification-results
          retention-days: 90
