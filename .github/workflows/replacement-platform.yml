name: Replacement Platform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://postgres:lobbystack@127.0.0.1:5432/lobbystack
      REDIS_URL: redis://127.0.0.1:6379
      LOBBYSTACK_APP_DATABASE_URL: postgres://lobbystack_app:app@127.0.0.1:5432/lobbystack
      LOBBYSTACK_AUTH_DATABASE_URL: postgres://lobbystack_auth:auth@127.0.0.1:5432/lobbystack
      LOBBYSTACK_WORKER_DATABASE_URL: postgres://lobbystack_worker:worker@127.0.0.1:5432/lobbystack
      LOBBYSTACK_DISPATCHER_DATABASE_URL: postgres://lobbystack_dispatcher:dispatcher@127.0.0.1:5432/lobbystack
      VERIFY_RLS_BEHAVIOR: "true"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: lobbystack
          POSTGRES_DB: lobbystack
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lobbystack"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Initialize replacement runtime roles
        run: PGPASSWORD=lobbystack PGHOST=127.0.0.1 PGPORT=5432 POSTGRES_USER=postgres POSTGRES_DB=lobbystack bash docker/postgres/init/roles.sh
      - run: pnpm db:migrate
      - name: Verify migration rerun safety
        run: pnpm db:migrate
      - run: pnpm db:check
      - run: pnpm db:verify-rls
      - run: pnpm db:seed
      - run: pnpm replacement:inventory
      - run: pnpm replacement:parity
      - run: pnpm replacement:drift
      - run: pnpm replacement:security
      - run: pnpm replacement:recovery
      - run: pnpm replacement:notifications
      - run: pnpm replacement:billing
      - run: pnpm replacement:auth
      - run: pnpm replacement:email-send
      - run: pnpm replacement:sms-consent
      - run: pnpm replacement:feedback
      - run: pnpm replacement:appointment-audits
      - run: pnpm replacement:unit-economics
      - run: pnpm replacement:import-check
      - run: pnpm replacement:reconciliation
      - run: pnpm replacement:phone-onboarding
      - run: pnpm --filter @lobbystack/contracts typecheck
      - run: pnpm --filter @lobbystack/jobs typecheck
      - run: pnpm --filter @lobbystack/telemetry typecheck
      - run: pnpm --filter @lobbystack/config typecheck
      - run: pnpm --filter @lobbystack/db typecheck
      - run: pnpm --filter @lobbystack/domain typecheck
      - run: pnpm --filter @lobbystack/providers typecheck
      - run: pnpm --filter @lobbystack/admin typecheck
      - run: pnpm --filter @lobbystack/worker typecheck
      - run: pnpm --filter @lobbystack/voice-gateway typecheck
      - run: pnpm --filter @lobbystack/contracts build
      - run: pnpm --filter @lobbystack/jobs build
      - run: pnpm --filter @lobbystack/telemetry build
      - run: pnpm --filter @lobbystack/db build
      - run: pnpm --filter @lobbystack/domain build
      - run: pnpm --filter @lobbystack/providers build
      - run: pnpm --filter @lobbystack/worker build
      - run: pnpm --filter @lobbystack/admin build
        env:
          NODE_ENV: production
      - run: pnpm --filter @lobbystack/admin exec playwright install --with-deps chromium
      - run: pnpm --filter @lobbystack/admin e2e
      - run: pnpm --filter @lobbystack/voice-gateway test
      - run: pnpm test
      - run: pnpm build
      - name: Build replacement runtime images
        run: |
          docker build --build-arg SERVICE_VERSION="$GITHUB_SHA" --file Dockerfile.admin --tag lobbystack/admin:ci .
          docker build --build-arg SERVICE_VERSION="$GITHUB_SHA" --file Dockerfile.migrator --tag lobbystack/migrator:ci .
          docker build --build-arg SERVICE_VERSION="$GITHUB_SHA" --file Dockerfile.worker --tag lobbystack/worker:ci .
          docker build --build-arg SERVICE_VERSION="$GITHUB_SHA" --file Dockerfile.voice-gateway --tag lobbystack/voice-gateway:ci .
          docker build --build-arg SERVICE_VERSION="$GITHUB_SHA" --file Dockerfile.otel-collector --tag lobbystack/otel-collector:ci .
      - run: pnpm replacement:telemetry
      - name: Scan repository for vulnerabilities, misconfigurations, and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan admin image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lobbystack/admin:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Scan migrator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lobbystack/migrator:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lobbystack/worker:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Scan voice gateway image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lobbystack/voice-gateway:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Scan collector image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lobbystack/otel-collector:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Validate collector configuration
        run: |
          docker run --rm \
            --entrypoint /otelcol-contrib \
            --env POSTHOG_OTLP_TRACES_ENDPOINT=https://us.i.posthog.com/i/v1/traces \
            --env POSTHOG_OTLP_METRICS_ENDPOINT=https://us.i.posthog.com/i/v1/metrics \
            --env POSTHOG_OTLP_LOGS_ENDPOINT=https://us.i.posthog.com/i/v1/logs \
            --env POSTHOG_OTLP_AUTHORIZATION= \
            --env OTEL_TRACE_SAMPLING_PERCENTAGE=100 \
            lobbystack/otel-collector:ci \
             validate --config=/etc/otelcol-contrib/config.yaml
      - name: Validate and test Prometheus alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/docker/prometheus:/etc/prometheus:ro" prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/docker/prometheus:/etc/prometheus:ro" prom/prometheus:v3.2.1 test rules /etc/prometheus/tests/alerts.test.yml
      - run: docker compose --env-file .env.replacement.example -f docker-compose.replacement.yml config --quiet

  staging-provider-certification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: replacement-staging
    env:
      ADMIN_BASE_URL: ${{ secrets.REPLACEMENT_ADMIN_BASE_URL }}
      WORKER_BASE_URL: ${{ secrets.REPLACEMENT_WORKER_BASE_URL }}
      VOICE_BASE_URL: ${{ secrets.REPLACEMENT_VOICE_BASE_URL }}
      DATABASE_URL: ${{ secrets.REPLACEMENT_DATABASE_URL }}
      REPLACEMENT_MIGRATOR_DATABASE_URL: ${{ secrets.REPLACEMENT_DATABASE_URL }}
      REPLACEMENT_APP_DATABASE_URL: ${{ secrets.REPLACEMENT_APP_DATABASE_URL }}
      REDIS_URL: ${{ secrets.REPLACEMENT_REDIS_URL }}
      REPLACEMENT_REDIS_HOST: ${{ secrets.REPLACEMENT_REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REPLACEMENT_REDIS_PORT }}
      REPLACEMENT_S3_ENDPOINT: ${{ secrets.REPLACEMENT_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.REPLACEMENT_S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.REPLACEMENT_S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.REPLACEMENT_S3_SECRET_ACCESS_KEY }}
      POLAR_WEBHOOK_SECRET: ${{ secrets.REPLACEMENT_POLAR_WEBHOOK_SECRET }}
      TWILIO_AUTH_TOKEN: ${{ secrets.REPLACEMENT_TWILIO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run staging certification
        run: |
          mkdir -p certification-results
          pnpm replacement:performance 2>&1 | tee certification-results/performance.log
          pnpm replacement:storage 2>&1 | tee certification-results/storage.log
          pnpm replacement:realtime 2>&1 | tee certification-results/realtime.log
          pnpm replacement:webhooks 2>&1 | tee certification-results/webhooks.log
          pnpm replacement:privacy 2>&1 | tee certification-results/privacy.log
          pnpm replacement:smoke 2>&1 | tee certification-results/smoke.log
          pnpm replacement:internal 2>&1 | tee certification-results/internal.log
      - name: Retain certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replacement-staging-certification-${{ github.sha }}
          path: certification-results
          retention-days: 90
