name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm telemetry:coverage
      - run: pnpm build
      - run: pnpm test
      - name: Build production runtime images
        run: |
          docker build --build-arg SERVICE_VERSION="$GITHUB_SHA" --file Dockerfile.admin --tag lobbystack/admin:ci .
          docker build --build-arg SERVICE_VERSION="$GITHUB_SHA" --file Dockerfile.worker --tag lobbystack/worker:ci .
          docker build --build-arg SERVICE_VERSION="$GITHUB_SHA" --file Dockerfile.voice-gateway --tag lobbystack/voice-gateway:ci .
      - name: Certify lazy tokenizer runtime dependencies
        run: |
          docker run --rm --entrypoint node lobbystack/admin:ci -e 'const { createRequire } = require("node:module"); const runtimeRequire = createRequire("/app/apps/admin/.next/server/chunks/runtime-dependency-check.js"); const { Tiktoken } = runtimeRequire("js-tiktoken/lite"); const tokenizer = new Tiktoken(runtimeRequire("js-tiktoken/ranks/o200k_base")); if (tokenizer.encode("runtime smoke test").length === 0) process.exit(1);'
          docker run --rm --entrypoint node lobbystack/worker:ci -e 'const { createRequire } = require("node:module"); const runtimeRequire = createRequire("/app/dist/runtime/index.js"); const { Tiktoken } = runtimeRequire("js-tiktoken/lite"); const tokenizer = new Tiktoken(runtimeRequire("js-tiktoken/ranks/o200k_base")); if (tokenizer.encode("runtime smoke test").length === 0) process.exit(1);'
          docker run --rm --entrypoint node lobbystack/voice-gateway:ci -e 'const { createRequire } = require("node:module"); const runtimeRequire = createRequire("/app/dist/runtime/index.js"); const { Tiktoken } = runtimeRequire("js-tiktoken/lite"); const tokenizer = new Tiktoken(runtimeRequire("js-tiktoken/ranks/o200k_base")); if (tokenizer.encode("runtime smoke test").length === 0) process.exit(1);'
      - run: pnpm replacement:telemetry
      - name: Validate Compose config
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

  migrate-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: production-migrations
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
      RAILWAY_PROJECT_ID: af0a130e-7b02-4fc0-94ef-b0ac45a0a0a6
      RAILWAY_ENVIRONMENT: production
      RAILWAY_SERVICE: migrator
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.57.9
      - name: Verify release is current
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Skipping superseded release ${GITHUB_SHA}; main is ${remote_sha}."
            exit 1
          fi
      - name: Run production migrations
        run: >-
          railway up
          --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT"
          --service "$RAILWAY_SERVICE"
          --message "GitHub ${GITHUB_SHA}"
      - name: Confirm release is current
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Blocking superseded release ${GITHUB_SHA}; main is ${remote_sha}."
            exit 1
          fi
