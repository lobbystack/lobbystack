  "protobufjs@>=8.0.0": ^8.6.6
  proxy-addr: ^2.0.8
  puppeteer: ^25.10.0
  puppeteer-core: ^25.10.0
  qs: ^6.16.0
  react-router: ^7.17.0
  react-router-dom: ^7.17.0
  sharp: ^0.35.5
  shell-quote: ^1.11.0
  socket.io-parser: ^4.2.7
  smol-toml: ^1.9.0
  source-map-js: ^1.2.2
  svgo: ^4.1.0
  tar: ^7.5.21
  undici: ^7.29.1
  uuid: ^14.0.0
  ws: ^8.22.0
  yaml: ^2.9.0

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current

onlyBuiltDependencies:
  - core-js
  - esbuild
  - msw
  - protobufjs
  - sharp
  - tesseract.js

patchedDependencies:
  "front-matter@4.0.2": patches/front-matter@4.0.2.patch

allowBuilds:
  '@posthog/cli': false
  core-js: true
  esbuild: true
  keytar: false
  msw: true
  protobufjs: true
  puppeteer: false
  sharp: true
  tesseract.js: true
