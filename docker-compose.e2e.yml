# Disposable, isolated infrastructure for the browser end-to-end gate.
#
# Every service is ephemeral: PostgreSQL and Redis keep their state in tmpfs so a
# `down -v` leaves nothing behind. Nothing here is used by production or by the
# long-lived local development stack in docker-compose.yml.
#
# Start with:
#   docker compose -p kinetic-yak-e2e -f docker-compose.e2e.yml up -d --wait
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kinetic-yak-e2e-postgres
    environment:
      POSTGRES_DB: lobbystack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e-postgres
      LOBBYSTACK_MIGRATOR_PASSWORD: migrator
      LOBBYSTACK_AUTH_PASSWORD: auth
      LOBBYSTACK_APP_PASSWORD: app
      LOBBYSTACK_WORKER_PASSWORD: worker
      LOBBYSTACK_DISPATCHER_PASSWORD: dispatcher
      LOBBYSTACK_READONLY_PASSWORD: readonly
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:-25433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/postgres/init/roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lobbystack"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    container_name: kinetic-yak-e2e-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${E2E_REDIS_PORT:-26380}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    container_name: kinetic-yak-e2e-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${E2E_MAILPIT_SMTP_PORT:-21025}:1025"
      - "127.0.0.1:${E2E_MAILPIT_UI_PORT:-28025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Optional outbox worker so the verification and recovery emails are delivered
  # to the local Mailpit sink instead of staying in the outbox table. Enable with
  #   docker compose ... --profile worker up -d
  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        SERVICE_VERSION: e2e
    container_name: kinetic-yak-e2e-worker
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://lobbystack_worker:worker@postgres:5432/lobbystack
      LOBBYSTACK_DISPATCHER_DATABASE_URL: postgres://lobbystack_dispatcher:dispatcher@postgres:5432/lobbystack
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      EMAIL_FROM: LobbyStack <no-reply@example.test>
