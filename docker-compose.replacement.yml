services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lobbystack}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?Set POSTGRES_AUTH_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?Set POSTGRES_WORKER_PASSWORD}
      POSTGRES_DISPATCHER_PASSWORD: ${POSTGRES_DISPATCHER_PASSWORD:?Set POSTGRES_DISPATCHER_PASSWORD}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:?Set POSTGRES_READONLY_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lobbystack}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/$${S3_BUCKET:-lobbystack-files}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lobbystack}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-lobbystack-files}

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["node_modules/.bin/tsx", "db/dist/cli.js", "migrate"]
    environment:
      NODE_ENV: production
      DATABASE_MIGRATOR_URL: postgres://lobbystack_migrator:${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}@postgres-pgvector:5432/${POSTGRES_DB:-lobbystack}
    depends_on:
      postgres-pgvector:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        NEXT_PUBLIC_POSTHOG_PRIVACY_MODE: ${NEXT_PUBLIC_POSTHOG_PRIVACY_MODE:-true}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      NEXT_PUBLIC_POSTHOG_PRIVACY_MODE: ${NEXT_PUBLIC_POSTHOG_PRIVACY_MODE:-true}
      DATABASE_URL: postgres://lobbystack_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres-pgvector:5432/${POSTGRES_DB:-lobbystack}
      DATABASE_APP_URL: postgres://lobbystack_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres-pgvector:5432/${POSTGRES_DB:-lobbystack}
      DATABASE_AUTH_URL: postgres://lobbystack_auth:${POSTGRES_AUTH_PASSWORD:?Set POSTGRES_AUTH_PASSWORD}@postgres-pgvector:5432/${POSTGRES_DB:-lobbystack}
      DATABASE_DISPATCHER_URL: postgres://lobbystack_dispatcher:${POSTGRES_DISPATCHER_PASSWORD:?Set POSTGRES_DISPATCHER_PASSWORD}@postgres-pgvector:5432/${POSTGRES_DB:-lobbystack}
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: lobbystack-admin
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-lobbystack}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: ${S3_BUCKET:-lobbystack-files}
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      APP_BASE_URL: ${APP_BASE_URL:-http://admin:3000}
      DATABASE_URL: postgres://lobbystack_worker:${POSTGRES_WORKER_PASSWORD:?Set POSTGRES_WORKER_PASSWORD}@postgres-pgvector:5432/${POSTGRES_DB:-lobbystack}
      DATABASE_WORKER_URL: postgres://lobbystack_worker:${POSTGRES_WORKER_PASSWORD:?Set POSTGRES_WORKER_PASSWORD}@postgres-pgvector:5432/${POSTGRES_DB:-lobbystack}
      DATABASE_DISPATCHER_URL: postgres://lobbystack_dispatcher:${POSTGRES_DISPATCHER_PASSWORD:?Set POSTGRES_DISPATCHER_PASSWORD}@postgres-pgvector:5432/${POSTGRES_DB:-lobbystack}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.test}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      POLAR_ORGANIZATION_TOKEN: ${POLAR_ORGANIZATION_TOKEN:-}
      CALENDAR_TOKEN_ENCRYPTION_KEY: ${CALENDAR_TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
      TESSERACT_LANG_PATH: ${TESSERACT_LANG_PATH:-}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-lobbystack}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: ${S3_BUCKET:-lobbystack-files}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: lobbystack-worker
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WORKER_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  voice-gateway:
    build:
      context: .
      dockerfile: Dockerfile.voice-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self_hosted_standard}
      PORT: 3001
      VOICE_GATEWAY_BASE_URL: ${VOICE_GATEWAY_BASE_URL:-http://localhost:3001}
      CONVEX_SITE_URL: ${BACKEND_INTERNAL_URL:-http://admin:3000}
      CONTROL_PLANE_URL: ${BACKEND_INTERNAL_URL:-http://admin:3000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: lobbystack-voice-gateway
    depends_on:
      admin:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VOICE_GATEWAY_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  otel-collector:
    build:
      context: .
      dockerfile: Dockerfile.otel-collector
    restart: unless-stopped
    environment:
      POSTHOG_OTLP_ENDPOINT: ${POSTHOG_OTLP_ENDPOINT:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${PROMETHEUS_PORT:-8889}:8889"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:13133/"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      otel-collector:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROMETHEUS_UI_PORT:-9090}:9090"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes:
      - ./docker/caddy/Caddyfile.replacement:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      admin:
        condition: service_healthy
      voice-gateway:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles: [dev]
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  prometheus_data:
