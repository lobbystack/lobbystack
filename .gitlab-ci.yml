# CI for the GitLab mirror (gitlab.com/lobbystack-group/lobbystack). It runs the
# checks, zapier and database jobs from .github/workflows/ci.yml on merge
# requests, on main, and when started by hand. The e2e, runtime image and
# replacement platform jobs need Docker, so run them with scripts/release-local.sh.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

default:
  image: node:26-bookworm
  interruptible: true

.pnpm:
  variables:
    PNPM_STORE_DIR: .pnpm-store
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - npm install --global pnpm@10.30.3
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

checks:
  extends: .pnpm
  timeout: 30m
  script:
    - pnpm test:build-config
    - pnpm typecheck
    - pnpm --filter @lobbystack/admin --filter @lobbystack/landing lint
    - pnpm telemetry:coverage
    - pnpm build
    - pnpm --filter @lobbystack/admin marketing:validate
    - git diff --exit-code -- apps/admin/public/embed/embed.js
    - pnpm test
    - pnpm replacement:telemetry

zapier:
  timeout: 15m
  script:
    - cd integrations/zapier
    - npm ci
    - npm test

database:
  extends: .pnpm
  timeout: 20m
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
      variables:
        POSTGRES_PASSWORD: lobbystack
        POSTGRES_DB: lobbystack_test
    - name: redis:7.4-alpine
      alias: redis
  variables:
    NODE_ENV: test
    LOBBYSTACK_SKIP_ENV_FILES: "true"
    DATABASE_URL: postgres://postgres:lobbystack@127.0.0.1:5432/lobbystack_test
    LOBBYSTACK_RELIABILITY_TEST_DATABASE_URL: postgres://postgres:lobbystack@127.0.0.1:5432/lobbystack_test
    LOBBYSTACK_AUTH_TEST_DATABASE_URL: postgres://postgres:lobbystack@127.0.0.1:5432/lobbystack_test
    LOBBYSTACK_APP_DATABASE_URL: postgres://lobbystack_app:app@127.0.0.1:5432/lobbystack_test
    LOBBYSTACK_AUTH_DATABASE_URL: postgres://lobbystack_auth:auth@127.0.0.1:5432/lobbystack_test
    LOBBYSTACK_WORKER_DATABASE_URL: postgres://lobbystack_worker:worker@127.0.0.1:5432/lobbystack_test
    LOBBYSTACK_DISPATCHER_DATABASE_URL: postgres://lobbystack_dispatcher:dispatcher@127.0.0.1:5432/lobbystack_test
    LOBBYSTACK_APP_PASSWORD: app
    LOBBYSTACK_AUTH_PASSWORD: auth
    LOBBYSTACK_WORKER_PASSWORD: worker
    LOBBYSTACK_DISPATCHER_PASSWORD: dispatcher
    REDIS_URL: redis://127.0.0.1:6379
    REDIS_TEST_URL: redis://127.0.0.1:6379
    VERIFY_RLS_BEHAVIOR: "true"
  script:
    # The integration tests only accept a test database on localhost, so forward the service ports there.
    - node -e 'const net = require("node:net"); for (const [port, host] of [[5432, "postgres"], [6379, "redis"]]) net.createServer((c) => { const s = net.connect(port, host); c.on("error", () => s.destroy()); s.on("error", () => c.destroy()); c.pipe(s).pipe(c); }).listen(port, "127.0.0.1");' &
    - pnpm -r --filter "./packages/**" build
    - for pass in 1 2; do pnpm db:migrate && pnpm --filter @lobbystack/db exec tsx src/cli.ts bootstrap || exit 1; done
    - pnpm db:check
    - pnpm db:verify-rls
    - pnpm test:reliability
    - pnpm --filter @lobbystack/admin exec vitest run src/lib/auth-issuance.integration.test.ts src/lib/email-verification-policy.test.ts
    - pnpm --filter @lobbystack/admin exec vitest run src/lib/voice-presence.integration.test.ts

# Releases to Dokploy (docs/deployment/dokploy-release.md). Each merge to main
# builds the images on GitLab's runners and pushes them to this project's
# container registry. The production release then runs on its own when the
# project variable DOKPLOY_AUTO_RELEASE is "true", and waits for a click
# otherwise. Staging always waits for a click. All three jobs need the
# protected variable DOKPLOY_API_KEY.
.dokploy:
  stage: deploy
  image: docker:29-cli
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    # The release checks the commit against main's history.
    GIT_DEPTH: "0"
    RELEASE_REGISTRY: $CI_REGISTRY_IMAGE
  # Never cancel a release halfway through.
  interruptible: false
  before_script:
    - apk add --no-cache git nodejs
    - for attempt in $(seq 30); do docker info > /dev/null 2>&1 && break; sleep 2; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin

images:
  extends: .dokploy
  needs: [checks, zapier, database]
  timeout: 45m
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - node scripts/dokploy-release.ts "$CI_COMMIT_SHA" --build-only --skip-superseded

release-production:
  extends: .dokploy
  needs: [images]
  # Longer than the script's own waits added up, so a stuck release still
  # reports what Dokploy points at before GitLab stops it.
  timeout: 1h30m
  resource_group: production
  environment:
    name: production
    url: https://app.lobbystack.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DOKPLOY_AUTO_RELEASE == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - node scripts/dokploy-release.ts "$CI_COMMIT_SHA" --skip-superseded

release-staging:
  extends: .dokploy
  needs: [images]
  # The production budget plus a build of the staging admin.
  timeout: 2h
  resource_group: staging
  environment:
    name: staging
    url: https://staging.lobbystack.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - node scripts/dokploy-release.ts "$CI_COMMIT_SHA" --env staging
