receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    timeout: 5s
    send_batch_size: 512
  tail_sampling:
    decision_wait: 2s
    expected_new_traces_per_sec: 100
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 500
      - name: voice
        type: string_attribute
        string_attribute:
          key: service.name
          values: [lobbystack-voice-gateway]
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:OTEL_TRACE_SAMPLING_PERCENTAGE}
  attributes/redact:
    actions:
      - key: db.statement
        action: delete
      - key: http.request.body
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - key: url.full
        action: delete
      - key: url.path
        action: delete
      - key: url.query
        action: delete
      - key: messaging.message.body
        action: delete
      - key: lobbystack.transcript
        action: delete
      - key: lobbystack.prompt
        action: delete

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:9464
  otlphttp/posthog:
    traces_endpoint: ${env:POSTHOG_OTLP_TRACES_ENDPOINT}
    metrics_endpoint: ${env:POSTHOG_OTLP_METRICS_ENDPOINT}
    logs_endpoint: ${env:POSTHOG_OTLP_LOGS_ENDPOINT}
    headers:
      Authorization: ${env:POSTHOG_OTLP_AUTHORIZATION}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, tail_sampling, batch]
      exporters: [debug, otlphttp/posthog]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, otlphttp/posthog]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [debug, otlphttp/posthog]
