; What happens to a call the carrier sends. Settings come from the container's environment (asterisk.env).
;
; The carrier routes each number to sip:<number>@<this server>, so the digits the call was dialled to arrive as the
; extension. The call goes to OpenAI with the caller's number in From and the dialled number in X-LobbyStack-Called,
; which the admin reads to find the business (docs/voice/runtime.md, "Follow a phone call").

[general]
static=yes
writeprotect=no

[from-zadarma]
exten => _X.,1,NoOp(Call to ${EXTEN})
 same => n,Set(CALLED=${FILTER(0-9,${EXTEN})})
 same => n,GotoIf($[${LEN(${CALLED})} < 8]?unknown)
 same => n,Gosub(caller-number,s,1)
 same => n,Set(CALLERID(num)=${CALLER})
 same => n,Set(CALLERID(name)=)
 same => n,Log(NOTICE,call dialled=+${CALLED} caller=${CALLER})
 same => n,Dial(PJSIP/${ENV(OPENAI_PROJECT_ID)}@openai,${ENV(RING_TIMEOUT)},b(openai-headers^s^1(${CALLED})))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,Log(WARNING,OpenAI did not take the call to +${CALLED}: ${DIALSTATUS})
 same => n,Congestion()
 same => n(busy),Busy()
 same => n(done),Hangup()
 same => n(unknown),Log(WARNING,call dialled to ${EXTEN}, which is not a number)
 same => n,Hangup(1)

; Anything that isn't digits, such as a number sent with a plus: the carrier is told the number doesn't exist.
exten => i,1,Log(WARNING,call dialled to ${INVALID_EXTEN}, which is not a number: use the digits only in the carrier's SIP address)
 same => n,Hangup(1)

; Sets CALLER to the caller's number as +<country code><number>, or "anonymous" when the carrier didn't send one.
; The carrier's caller number is CALLERID(num): P-Asserted-Identity or Remote-Party-ID when the carrier sends either, else From.
; Set CALLER_HEADER to read it from another header, such as X-Caller.
[caller-number]
exten => s,1,Set(RAW=${CALLERID(num)})
 ; CUT takes a variable's name, so the header goes into one first. "<sip:0641234567@host>" becomes 0641234567.
 same => n,ExecIf($["${ENV(CALLER_HEADER)}" != ""]?Set(HDR=${PJSIP_HEADER(read,${ENV(CALLER_HEADER)})}))
 same => n,ExecIf($["${HDR}" != ""]?Set(RAW=${CUT(HDR,@,1)}))
 same => n,ExecIf($["${HDR}" != ""]?Set(RAW=${CUT(RAW,:,2)}))
 same => n,Set(NUM=${FILTER(0-9+,${RAW})})
 same => n,ExecIf($["${NUM:0:2}" = "00"]?Set(NUM=+${NUM:2}))
 same => n,ExecIf($["${NUM:0:1}" = "0"]?Set(NUM=+${ENV(DEFAULT_COUNTRY_CODE)}${NUM:1}))
 same => n,ExecIf($["${NUM}" != "" & "${NUM:0:1}" != "+"]?Set(NUM=+${NUM}))
 ; A number that is the dialled one, or too short to be a number, is no caller. The admin keeps such a call without a contact number.
 same => n,ExecIf($["${NUM}" = "+${CALLED}" | ${LEN(${NUM})} < 9]?Set(NUM=anonymous))
 same => n,Set(CALLER=${NUM})
 same => n,Return()

; Runs on the call's outgoing leg, where a header can be added. ARG1 is the dialled number's digits.
[openai-headers]
exten => s,1,Set(PJSIP_HEADER(add,X-LobbyStack-Called)=tel:+${ARG1})
 same => n,Return()

; Nothing calls in from OpenAI.
[from-openai]
exten => _X.,1,Hangup(21)
